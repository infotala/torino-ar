<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mole AR GPS Test</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<style>
*{margin:0;padding:0}
#overlay{position:fixed;top:0;left:0;right:0;z-index:999;pointer-events:none}
#info{background:rgba(0,0,0,0.75);color:#fff;padding:10px 16px;font-family:sans-serif;
  font-size:12px;line-height:1.4;text-align:center}
#status{background:rgba(201,168,76,0.9);color:#1a1916;padding:6px 16px;font-family:monospace;
  font-size:11px;text-align:center}
#permission-btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;
  background:#C9A84C;color:#1a1916;border:none;border-radius:8px;padding:20px 30px;
  font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
#debug{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.8);color:#0f0;
  font-family:monospace;font-size:10px;padding:8px 12px;z-index:999;
  max-height:25vh;overflow-y:auto}
</style>
</head>
<body>

<button id="permission-btn" onclick="startAR()">Tocca per avviare AR</button>

<div id="overlay" style="display:none">
  <div id="info">
    <strong>Mole Antonelliana · AR GPS</strong><br>
    Guardati intorno — cerca il cubo rosso e la Mole
  </div>
  <div id="status">GPS: in attesa...</div>
</div>
<div id="debug" style="display:none"></div>

<div id="ar-container" style="display:none">
<a-scene
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
  renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
  embedded>

  <!-- Cubo rosso test: posizionato a coordinate che verranno aggiornate via JS -->
  <a-entity id="test-cube"
    gps-entity-place="latitude: 45.06520; longitude: 7.69180"
    geometry="primitive: box; width: 10; height: 10; depth: 10"
    material="color: red; opacity: 0.8">
  </a-entity>

  <!-- Mole alle coordinate reali -->
  <a-entity id="mole-model"
    gps-entity-place="latitude: 45.06935; longitude: 7.69295"
    gltf-model="mole_antonelliana_torino.glb"
    scale="10 10 10"
    rotation="0 0 0">
  </a-entity>

  <!-- Colonna gialla altissima sopra la Mole come faro -->
  <a-entity
    gps-entity-place="latitude: 45.06935; longitude: 7.69295">
    <a-box color="yellow" width="5" height="300" depth="5" position="0 150 0" opacity="0.6"></a-box>
  </a-entity>

  <a-camera gps-camera="simulateLatitude: 0; simulateLongitude: 0" rotation-reader></a-camera>
</a-scene>
</div>

<script>
var dbg = document.getElementById('debug');
var statusEl = document.getElementById('status');
var started = false;

function log(msg) {
  var t = new Date().toLocaleTimeString();
  dbg.innerHTML = t + ' ' + msg + '<br>' + dbg.innerHTML;
  if (dbg.children.length > 25) dbg.lastChild.remove();
}

function startAR() {
  if (started) return;
  started = true;

  // Richiedi permesso orientamento iOS
  if (typeof DeviceOrientationEvent !== 'undefined' && 
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(function(response) {
        log('Permesso orientamento: ' + response);
        if (response === 'granted') {
          window.addEventListener('deviceorientation', function(e) {
            if (e.alpha !== null) {
              log('Bussola attiva: heading=' + e.alpha.toFixed(0) + '°');
            }
          }, {once: true});
        }
        launchScene();
      })
      .catch(function(err) {
        log('Errore permesso orientamento: ' + err);
        launchScene();
      });
  } else {
    log('DeviceOrientation: nessun permesso necessario');
    launchScene();
  }
}

function launchScene() {
  document.getElementById('permission-btn').style.display = 'none';
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('debug').style.display = 'block';
  document.getElementById('ar-container').style.display = 'block';
  log('Scena AR avviata');

  // Posiziona il cubo test vicino alla posizione attuale
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;
      // Metti il cubo ~20 metri a nord
      var cubeLat = lat + 0.00018;
      var cubeLon = lon;
      var cube = document.getElementById('test-cube');
      cube.setAttribute('gps-entity-place', 'latitude: ' + cubeLat + '; longitude: ' + cubeLon);
      log('Cubo rosso posizionato a ~20m nord da te');
    });
  }

  // Monitor GPS continuo
  navigator.geolocation.watchPosition(
    function(pos) {
      var lat = pos.coords.latitude.toFixed(6);
      var lon = pos.coords.longitude.toFixed(6);
      var acc = pos.coords.accuracy.toFixed(0);
      statusEl.textContent = 'GPS: ' + lat + ', ' + lon + ' · ±' + acc + 'm';
    },
    function(err) {
      statusEl.textContent = 'GPS errore: ' + err.message;
    },
    {enableHighAccuracy: true, maximumAge: 0, timeout: 27000}
  );

  // Monitor modello
  var model = document.getElementById('mole-model');
  if (model) {
    model.addEventListener('model-loaded', function() {
      log('Mole GLB caricato ✅');
    });
    model.addEventListener('gps-entity-place-added', function(e) {
      log('Mole posizionata a ' + e.detail.distance.toFixed(0) + 'm');
    });
  }
  var cube = document.getElementById('test-cube');
  if (cube) {
    cube.addEventListener('gps-entity-place-added', function(e) {
      log('Cubo rosso a ' + e.detail.distance.toFixed(0) + 'm ✅');
    });
  }
}
</script>
</body>
</html>
