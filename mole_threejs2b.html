<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mole AR · Three.js</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#splash{position:fixed;inset:0;z-index:999;background:#1a1916;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
#splash h1{color:#C9A84C;font-family:sans-serif;font-size:24px;font-weight:400}
#splash p{color:#999;font-family:sans-serif;font-size:13px;max-width:280px;
  text-align:center;line-height:1.5}
#start{background:#C9A84C;color:#1a1916;border:none;border-radius:8px;
  padding:18px 40px;font-size:18px;font-weight:600;cursor:pointer}
#loading{color:#C9A84C;font-family:sans-serif;font-size:13px;display:none}
.hide{display:none !important}

#hud{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none}
#hud-bar{background:rgba(0,0,0,0.6);padding:6px 14px;font:11px/1.4 monospace;color:#C9A84C;
  text-align:center}
#compass{position:fixed;top:42px;right:12px;z-index:10;width:50px;height:50px;pointer-events:none}
#compass svg{width:100%;height:100%}
#direction{position:fixed;top:42px;left:12px;z-index:10;background:rgba(0,0,0,0.6);
  color:#fff;font:12px sans-serif;padding:6px 10px;border-radius:4px;pointer-events:none}
#distance-tag{position:fixed;z-index:10;background:rgba(201,168,76,0.85);
  color:#1a1916;font:bold 12px sans-serif;padding:4px 10px;border-radius:3px;
  pointer-events:none;display:none;white-space:nowrap}
#log{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(0,0,0,0.8);
  color:#0f0;font:10px monospace;padding:6px 10px;max-height:15vh;overflow-y:auto}

/* CALIBRATION PANEL */
#calib{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(0,0,0,0.9);
  padding:10px 12px 14px;display:none;border-top:2px solid #C9A84C}
#calib.show{display:block}
#calib-toggle{position:fixed;bottom:10px;right:10px;z-index:21;background:#C9A84C;
  color:#1a1916;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.5);display:none}
#calib-toggle.show{display:block}
.calib-title{font:bold 10px sans-serif;color:#C9A84C;letter-spacing:0.15em;
  text-transform:uppercase;margin-bottom:8px}
.calib-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.calib-label{color:#888;font:10px sans-serif;width:70px;text-transform:uppercase;
  letter-spacing:0.08em}
.calib-val{color:#C9A84C;font:bold 13px monospace;width:70px;text-align:center}
.calib-btn{background:#333;color:#ddd;border:1px solid #555;border-radius:3px;
  padding:6px 0;font-size:16px;cursor:pointer;width:36px;text-align:center}
.calib-btn:active{background:#555}
.calib-btn-sm{width:28px;font-size:12px;padding:4px 0}
.calib-spacer{width:6px}
#calib-copy{margin-top:8px;width:100%;background:#C9A84C;color:#1a1916;border:none;
  border-radius:3px;padding:10px;font:bold 12px sans-serif;letter-spacing:0.1em;
  text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>

<div id="splash">
  <h1>Mole Antonelliana</h1>
  <p>AR con GPS + Three.js<br>Punta il telefono verso la Mole</p>
  <button id="start">Avvia AR</button>
  <div id="loading">Caricamento modello 3D...</div>
</div>

<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>

<div id="hud"><div id="hud-bar">Inizializzazione...</div></div>
<div id="direction"></div>
<div id="compass">
  <svg viewBox="0 0 50 50">
    <circle cx="25" cy="25" r="23" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <polygon id="needle" points="25,5 28,22 25,20 22,22" fill="#C9A84C"/>
    <circle cx="25" cy="25" r="2" fill="#C9A84C"/>
  </svg>
</div>
<div id="distance-tag"></div>

<button id="calib-toggle" onclick="toggleCalib()">⚙</button>

<div id="calib">
  <div class="calib-title">Calibrazione</div>
  
  <div class="calib-row">
    <div class="calib-label">Altezza</div>
    <button class="calib-btn" onclick="adj('y',-5)">▼▼</button>
    <button class="calib-btn calib-btn-sm" onclick="adj('y',-1)">▼</button>
    <div class="calib-val" id="v-y">0 m</div>
    <button class="calib-btn calib-btn-sm" onclick="adj('y',1)">▲</button>
    <button class="calib-btn" onclick="adj('y',5)">▲▲</button>
  </div>
  
  <div class="calib-row">
    <div class="calib-label">Rotazione</div>
    <button class="calib-btn" onclick="adj('r',-10)">◄◄</button>
    <button class="calib-btn calib-btn-sm" onclick="adj('r',-2)">◄</button>
    <div class="calib-val" id="v-r">0°</div>
    <button class="calib-btn calib-btn-sm" onclick="adj('r',2)">►</button>
    <button class="calib-btn" onclick="adj('r',10)">►►</button>
  </div>
  
  <div class="calib-row">
    <div class="calib-label">Scala</div>
    <button class="calib-btn" onclick="adj('s',-0.2)">−−</button>
    <button class="calib-btn calib-btn-sm" onclick="adj('s',-0.05)">−</button>
    <div class="calib-val" id="v-s">1.0x</div>
    <button class="calib-btn calib-btn-sm" onclick="adj('s',0.05)">+</button>
    <button class="calib-btn" onclick="adj('s',0.2)">++</button>
  </div>

  <div class="calib-row">
    <div class="calib-label">Nord/Sud</div>
    <button class="calib-btn" onclick="adj('lat',-0.0001)">S▼</button>
    <button class="calib-btn calib-btn-sm" onclick="adj('lat',-0.00002)">s</button>
    <div class="calib-val" id="v-lat">0</div>
    <button class="calib-btn calib-btn-sm" onclick="adj('lat',0.00002)">n</button>
    <button class="calib-btn" onclick="adj('lat',0.0001)">N▲</button>
  </div>

  <div class="calib-row">
    <div class="calib-label">Est/Ovest</div>
    <button class="calib-btn" onclick="adj('lon',-0.0001)">O◄</button>
    <button class="calib-btn calib-btn-sm" onclick="adj('lon',-0.00002)">o</button>
    <div class="calib-val" id="v-lon">0</div>
    <button class="calib-btn calib-btn-sm" onclick="adj('lon',0.00002)">e</button>
    <button class="calib-btn" onclick="adj('lon',0.0001)">E►</button>
  </div>

  <button id="calib-copy" onclick="copyCalib()">📋 Copia valori e manda a Claude</button>
</div>

<div id="log"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const splash = document.getElementById('splash');
const loadingEl = document.getElementById('loading');
const hudBar = document.getElementById('hud-bar');
const dirEl = document.getElementById('direction');
const needle = document.getElementById('needle');
const distTag = document.getElementById('distance-tag');
const logEl = document.getElementById('log');
const startBtn = document.getElementById('start');

function log(m) {
  logEl.innerHTML = new Date().toLocaleTimeString() + ' ' + m + '<br>' + logEl.innerHTML;
  if (logEl.children.length > 30) logEl.lastChild.remove();
}

// === COORDINATE MOLE (base) ===
const BASE_LAT = 45.06935;
const BASE_LON = 7.69295;

// === CALIBRAZIONE ===
const cal = { y: 0, r: 0, s: 1.0, lat: 0, lon: 0 };

window.adj = function(axis, delta) {
  if (axis === 's') cal.s = Math.max(0.1, Math.round((cal.s + delta) * 100) / 100);
  else if (axis === 'y') cal.y = Math.round((cal.y + delta) * 10) / 10;
  else if (axis === 'r') cal.r = Math.round(((cal.r + delta) + 360) % 360 * 10) / 10;
  else if (axis === 'lat') cal.lat = Math.round((cal.lat + delta) * 100000) / 100000;
  else if (axis === 'lon') cal.lon = Math.round((cal.lon + delta) * 100000) / 100000;

  document.getElementById('v-y').textContent = cal.y + ' m';
  document.getElementById('v-r').textContent = cal.r + '°';
  document.getElementById('v-s').textContent = cal.s + 'x';
  document.getElementById('v-lat').textContent = (cal.lat >= 0 ? '+' : '') + cal.lat;
  document.getElementById('v-lon').textContent = (cal.lon >= 0 ? '+' : '') + cal.lon;

  // Applica
  if (moleGroup) {
    moleGroup.rotation.y = cal.r * Math.PI / 180;
    if (baseScale) {
      moleGroup.scale.set(baseScale * cal.s, baseScale * cal.s, baseScale * cal.s);
    }
  }
};

window.toggleCalib = function() {
  document.getElementById('calib').classList.toggle('show');
};

window.copyCalib = function() {
  const moleLat = (BASE_LAT + cal.lat).toFixed(6);
  const moleLon = (BASE_LON + cal.lon).toFixed(6);
  const txt = 'CALIBRAZIONE MOLE ANTONELLIANA\n' +
    'Altezza: ' + cal.y + 'm\n' +
    'Rotazione: ' + cal.r + '°\n' +
    'Scala: ' + cal.s + 'x\n' +
    'Lat offset: ' + cal.lat + ' → ' + moleLat + '\n' +
    'Lon offset: ' + cal.lon + ' → ' + moleLon;
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function() {
      alert('Valori copiati!\n\nIncollali nella chat con Claude.');
    });
  } else {
    prompt('Copia questi valori e mandali a Claude:', txt);
  }
};

// === STATO ===
let heading = 0, deviceBeta = 0;
let userLat = 0, userLon = 0, gpsReady = false;
let moleGroup = null;
let baseScale = null;

// === MATH GEO ===
function gpsToLocal(lat, lon, refLat, refLon) {
  const R = 6371000;
  const dLat = (lat - refLat) * Math.PI / 180;
  const dLon = (lon - refLon) * Math.PI / 180;
  return { x: dLon * R * Math.cos(refLat * Math.PI / 180), z: -dLat * R };
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) -
            Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// === THREE.JS ===
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 100000);
camera.position.set(0, 1.6, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 200, 50);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87CEEB, 0x654321, 0.3));

moleGroup = new THREE.Group();
scene.add(moleGroup);

// Cubo rosso test
const testCube = new THREE.Mesh(
  new THREE.BoxGeometry(5, 5, 5),
  new THREE.MeshLambertMaterial({ color: 0xff0000 })
);
testCube.position.set(0, 2.5, -25);
scene.add(testCube);

// === CARICA GLB ===
function loadMoleGLB() {
  return new Promise((resolve, reject) => {
    new GLTFLoader().load(
      'mole_antonelliana_torino.glb',
      (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        box.getSize(size);
        const scaleFactor = 167 / size.y;
        baseScale = scaleFactor;
        model.scale.set(scaleFactor, scaleFactor, scaleFactor);
        const box2 = new THREE.Box3().setFromObject(model);
        model.position.y = -box2.min.y;
        moleGroup.add(model);
        log('GLB caricato ✅ scala:' + scaleFactor.toFixed(2));
        resolve();
      },
      (p) => { if (p.total) loadingEl.textContent = 'Modello: ' + (p.loaded/p.total*100).toFixed(0) + '%'; },
      (err) => { log('GLB err: ' + err.message); reject(err); }
    );
  });
}

// === RENDER LOOP ===
function animate() {
  requestAnimationFrame(animate);

  if (gpsReady) {
    const moleLat = BASE_LAT + cal.lat;
    const moleLon = BASE_LON + cal.lon;
    const moleLocal = gpsToLocal(moleLat, moleLon, userLat, userLon);
    moleGroup.position.set(moleLocal.x, cal.y, moleLocal.z);
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = -(heading * Math.PI / 180);
  camera.rotation.x = -(deviceBeta * Math.PI / 180 - Math.PI / 2);

  renderer.render(scene, camera);

  if (gpsReady) {
    const moleLat = BASE_LAT + cal.lat;
    const moleLon = BASE_LON + cal.lon;
    const dist = haversine(userLat, userLon, moleLat, moleLon);
    const bear = bearing(userLat, userLon, moleLat, moleLon);
    hudBar.textContent = 'GPS: ' + userLat.toFixed(5) + ', ' + userLon.toFixed(5) +
      ' | Mole: ' + dist.toFixed(0) + 'm · ' + bear.toFixed(0) + '°';

    let rel = ((bear - heading) + 360) % 360;
    let arrow = '↑ davanti';
    if (rel > 22 && rel <= 67) arrow = '↗';
    else if (rel > 67 && rel <= 112) arrow = '→ destra';
    else if (rel > 112 && rel <= 157) arrow = '↘';
    else if (rel > 157 && rel <= 202) arrow = '↓ dietro';
    else if (rel > 202 && rel <= 247) arrow = '↙';
    else if (rel > 247 && rel <= 292) arrow = '← sinistra';
    else if (rel > 292 && rel <= 337) arrow = '↖';
    dirEl.textContent = 'Mole ' + arrow + ' ' + dist.toFixed(0) + 'm';

    const moleScreen = new THREE.Vector3(moleGroup.position.x, 80, moleGroup.position.z);
    moleScreen.project(camera);
    if (moleScreen.z < 1 && Math.abs(moleScreen.x) < 1.2 && Math.abs(moleScreen.y) < 1.2) {
      const sx = (moleScreen.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-moleScreen.y * 0.5 + 0.5) * window.innerHeight;
      distTag.style.display = 'block';
      distTag.style.left = sx + 'px';
      distTag.style.top = sy + 'px';
      distTag.textContent = 'Mole Antonelliana · ' + dist.toFixed(0) + 'm';
    } else {
      distTag.style.display = 'none';
    }
  }

  needle.setAttribute('transform', 'rotate(' + (-heading) + ' 25 25)');
}

// === AVVIO ===
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Caricamento...';
  loadingEl.style.display = 'block';

  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch(e) { log('Err orient: ' + e); }

  window.addEventListener('deviceorientation', (e) => {
    if (e.webkitCompassHeading !== undefined) heading = e.webkitCompassHeading;
    else if (e.alpha !== null) heading = (360 - e.alpha) % 360;
    deviceBeta = e.beta || 0;
  }, true);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    log('Camera OK');
  } catch(e) { log('Camera err: ' + e); }

  try {
    await loadMoleGLB();
  } catch(e) {
    log('Fallback placeholder');
    const base = new THREE.Mesh(new THREE.BoxGeometry(40,30,40), new THREE.MeshLambertMaterial({color:0xD4C5A0}));
    base.position.y = 15; moleGroup.add(base);
    const spire = new THREE.Mesh(new THREE.ConeGeometry(8,140,8), new THREE.MeshLambertMaterial({color:0xB8A888}));
    spire.position.y = 100; moleGroup.add(spire);
    baseScale = 1;
  }

  navigator.geolocation.watchPosition(
    (pos) => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      if (!gpsReady) {
        gpsReady = true;
        log('GPS: ' + userLat.toFixed(6) + ', ' + userLon.toFixed(6) + ' ±' + pos.coords.accuracy.toFixed(0) + 'm');
      }
    },
    (e) => { log('GPS err: ' + e.message); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
  );

  splash.classList.add('hide');
  document.getElementById('calib-toggle').classList.add('show');
  log('AR avviata — premi ⚙ per calibrazione');
  animate();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
