<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR GPS Test</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
#perm{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:flex;
  align-items:center;justify-content:center}
#perm button{background:#C9A84C;color:#111;border:none;border-radius:8px;
  padding:20px 40px;font-size:20px;font-weight:700;cursor:pointer}
#perm.hide{display:none}
#dbg{position:fixed;bottom:0;left:0;right:0;z-index:999;background:rgba(0,0,0,0.85);
  color:#0f0;font:10px monospace;padding:6px 10px;max-height:30vh;overflow-y:auto}
</style>
</head>
<body>

<div id="perm">
  <button onclick="go()">AVVIA AR</button>
</div>
<div id="dbg"></div>

<a-scene
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
  renderer="antialias: true; alpha: true"
  embedded>

  <!-- Cubo rosso: coordinate aggiornate via JS alla posizione utente +25m nord -->
  <a-entity id="cubo" gps-entity-place="latitude: 45.065; longitude: 7.692">
    <a-box color="red" scale="20 20 20"></a-box>
  </a-entity>

  <!-- Colonna gialla gigante alla Mole -->
  <a-entity gps-entity-place="latitude: 45.06935; longitude: 7.69295">
    <a-box color="yellow" scale="10 500 10" position="0 250 0"></a-box>
  </a-entity>

  <!-- Sfera verde gigante alla Mole -->
  <a-entity gps-entity-place="latitude: 45.06935; longitude: 7.69295">
    <a-sphere color="green" radius="50" position="0 50 0"></a-sphere>
  </a-entity>

  <a-camera gps-camera rotation-reader near="1" far="200000"></a-camera>

</a-scene>

<script>
var d = document.getElementById('dbg');
function log(m){ d.innerHTML = new Date().toLocaleTimeString()+' '+m+'<br>'+d.innerHTML; }

async function go(){
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
      log('Bussola OK');
    }
  } catch(e){ log('Bussola err: '+e); }
  document.getElementById('perm').classList.add('hide');

  // Aggiorna cubo rosso alla posizione utente +25m
  navigator.geolocation.getCurrentPosition(function(p){
    var el = document.getElementById('cubo');
    var lat = p.coords.latitude + 0.00022;
    var lon = p.coords.longitude;
    el.setAttribute('gps-entity-place', 'latitude: '+lat+'; longitude: '+lon);
    log('Cubo spostato a '+lat.toFixed(6)+', '+lon.toFixed(6));
    log('Tu sei a '+p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)+' ±'+p.coords.accuracy.toFixed(0)+'m');
  }, function(e){ log('GPS err: '+e.message); }, {enableHighAccuracy:true});

  // Monitor
  window.addEventListener('deviceorientation', function(e){
    if(e.alpha) log('Heading: '+e.alpha.toFixed(0)+'°');
  }, {once:true});

  document.querySelector('[gps-entity-place]').addEventListener('gps-entity-place-added', function(e){
    log('Oggetto aggiunto dist:'+e.detail.distance.toFixed(0)+'m');
  });
}

// Scene loaded
document.querySelector('a-scene').addEventListener('loaded', function(){ log('Scena ready'); });
</script>
</body>
</html>
