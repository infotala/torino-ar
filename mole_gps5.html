<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mole AR GPS</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<style>
*{margin:0;padding:0}
#splash{position:fixed;inset:0;z-index:9999;background:#1a1916;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px}
#splash h1{color:#C9A84C;font-family:sans-serif;font-size:22px;font-weight:400}
#splash p{color:#999;font-family:sans-serif;font-size:13px;max-width:280px;text-align:center}
#go-btn{background:#C9A84C;color:#1a1916;border:none;border-radius:8px;
  padding:18px 40px;font-size:18px;font-weight:600;cursor:pointer;margin-top:10px}
#hud{position:fixed;top:0;left:0;right:0;z-index:999;pointer-events:none}
#hud-status{background:rgba(201,168,76,0.9);color:#1a1916;padding:6px 12px;
  font-family:monospace;font-size:11px;text-align:center}
#hud-log{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.8);color:#0f0;
  font-family:monospace;font-size:10px;padding:6px 10px;z-index:999;
  max-height:25vh;overflow-y:auto}
</style>
</head>
<body>

<!-- Splash: chiede permesso orientamento prima che A-Frame parta -->
<div id="splash">
  <h1>Mole Antonelliana</h1>
  <p>Test AR con GPS. Dopo aver premuto il bottone, guardati intorno lentamente a 360°</p>
  <button id="go-btn">Avvia AR</button>
</div>

<div id="hud" style="display:none">
  <div id="hud-status">In attesa GPS...</div>
</div>
<div id="hud-log" style="display:none"></div>

<script>
var logEl, statusEl;

function log(msg) {
  if (!logEl) return;
  var t = new Date().toLocaleTimeString();
  logEl.innerHTML = t + ' ' + msg + '<br>' + logEl.innerHTML;
}

document.getElementById('go-btn').addEventListener('click', function() {
  // 1. Chiedi permesso orientamento iOS
  var p = Promise.resolve();
  if (typeof DeviceOrientationEvent !== 'undefined' && 
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    p = DeviceOrientationEvent.requestPermission();
  }
  
  p.then(function() {
    // 2. Nascondi splash
    document.getElementById('splash').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('hud-log').style.display = 'block';
    logEl = document.getElementById('hud-log');
    statusEl = document.getElementById('hud-status');
    log('Permesso orientamento OK');
    
    // 3. Ottieni posizione attuale per piazzare il cubo test vicino
    navigator.geolocation.getCurrentPosition(function(pos) {
      var myLat = pos.coords.latitude;
      var myLon = pos.coords.longitude;
      var acc = pos.coords.accuracy.toFixed(0);
      log('Posizione: ' + myLat.toFixed(6) + ', ' + myLon.toFixed(6) + ' ±' + acc + 'm');
      
      // Cubo test a ~20m nord
      var cubeLat = myLat + 0.00018;
      var cubeLon = myLon;
      
      // 4. Ora crea la scena A-Frame dinamicamente
      var sceneHTML = '<a-scene' +
        ' vr-mode-ui="enabled: false"' +
        ' arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"' +
        ' renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"' +
        ' embedded>' +
        
        '<a-entity id="test-cube"' +
        ' gps-entity-place="latitude: ' + cubeLat + '; longitude: ' + cubeLon + '"' +
        ' geometry="primitive: box; width: 10; height: 10; depth: 10"' +
        ' material="color: red; opacity: 0.8">' +
        '</a-entity>' +

        '<a-entity id="beacon"' +
        ' gps-entity-place="latitude: 45.06935; longitude: 7.69295"' +
        ' geometry="primitive: box; width: 5; height: 300; depth: 5"' +
        ' material="color: yellow; opacity: 0.6"' +
        ' position="0 150 0">' +
        '</a-entity>' +

        '<a-entity id="mole"' +
        ' gps-entity-place="latitude: 45.06935; longitude: 7.69295"' +
        ' gltf-model="https://infotala.github.io/torino-ar/mole_antonelliana_torino.glb"' +
        ' scale="10 10 10">' +
        '</a-entity>' +

        '<a-camera gps-camera rotation-reader></a-camera>' +
        '</a-scene>';
      
      var container = document.createElement('div');
      container.innerHTML = sceneHTML;
      document.body.appendChild(container);
      log('Scena creata con cubo a ' + cubeLat.toFixed(6) + ', ' + cubeLon.toFixed(6));
      
      // Monitor
      setTimeout(function() {
        var scene = document.querySelector('a-scene');
        if (scene) {
          scene.addEventListener('loaded', function() {
            log('Scena A-Frame caricata ✅');
          });
        }
        var mole = document.getElementById('mole');
        if (mole) {
          mole.addEventListener('model-loaded', function() { log('Mole GLB ✅'); });
          mole.addEventListener('model-error', function() { log('Mole GLB ERRORE ❌'); });
        }
        var cube = document.getElementById('test-cube');
        if (cube) {
          cube.addEventListener('gps-entity-place-added', function(e) {
            log('Cubo rosso visibile a ' + e.detail.distance.toFixed(0) + 'm ✅');
          });
        }
      }, 1000);
      
      // GPS continuo
      navigator.geolocation.watchPosition(function(pos) {
        statusEl.textContent = 'GPS: ' + pos.coords.latitude.toFixed(6) + ', ' +
          pos.coords.longitude.toFixed(6) + ' · ±' + pos.coords.accuracy.toFixed(0) + 'm';
      }, function(){}, {enableHighAccuracy: true, maximumAge: 0});
      
    }, function(err) {
      log('Errore GPS: ' + err.message);
    }, {enableHighAccuracy: true, timeout: 15000});
    
  }).catch(function(err) {
    alert('Permesso orientamento negato: ' + err);
  });
});
</script>
</body>
</html>
